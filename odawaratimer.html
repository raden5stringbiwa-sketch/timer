      <!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>小田原タイマー</title>
  <style>
    body {
      background-color: #111;
      color: #eee;
      font-family: sans-serif;
      text-align: center;
      padding: 30px;
    }

    #titleRow {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-bottom: 10px;
    }

    .titleLogo {
      width: 60px;
      height: 60px;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 0 8px rgba(0, 255, 100, 0.35);
      opacity: 0.95;
    }

    h1 {
      color: #ff6600;
      font-size: 36px;
      margin: 0;
    }

    #countdown, #nextTime {
      font-size: 24px;
      margin: 10px 0;
    }

    #history {
      margin-top: 30px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      text-align: left;
    }

    #history div {
      background-color: #222;
      padding: 10px 14px;
      margin-bottom: 6px;
      border-left: 4px solid #ff6600;
      font-size: 18px;
      line-height: 1.4;
    }

    #startButton {
      background: linear-gradient(45deg, #006633, #004422);
      color: #ffdd55;
      font-size: 24px;
      font-weight: bold;
      padding: 16px 32px;
      border: none;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 255, 100, 0.4);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.3s;
    }

    #startButton:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(0, 255, 100, 0.6);
    }

    #credit {
      margin-top: 5px;
      color: #66ff66;
      font-size: 16px;
      opacity: 0.85;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div id="titleRow">
    <img src="alliance_logo.jpg" class="titleLogo">
    <h1>🏮小田原タイマー</h1>
    <img src="alliance_logo.jpg" class="titleLogo">
  </div>

  <div id="credit">
    © 殺罰 — Crafted by 豆大福
  </div>

  <button id="startButton" onclick="startTimer()">🔥 タイマー開始 🔥</button>
  <p id="countdown">残り時間: -</p>
  <p id="nextTime">60分後の時刻: -</p>
  <div id="history"></div>

  <!-- 無音ファイル（自動再生解除用） -->
  <audio id="silent" src="silent.mp3" preload="none"></audio>
<audio id="MCcheck" src="MCcheck.m4a" preload="auto"></audio>      
      
<audio id="sento_0130" src="sento_0130.m4a" preload="auto"></audio>
<audio id="sento_0030" src="sento_0030.m4a" preload="auto"></audio>
<audio id="sento_0010" src="sento_0010.m4a" preload="auto"></audio>
<audio id="sento_start" src="sento_start.m4a" preload="auto"></audio>
      
      <audio id="yama_0130" src="yama_0130.m4a" preload="auto"></audio>
<audio id="yama_0030" src="yama_0030.m4a" preload="auto"></audio>
<audio id="yama_0010" src="yama_0010.m4a" preload="auto"></audio>
<audio id="yama_start" src="yama_start.m4a" preload="auto"></audio>

<audio id="nuke_0130" src="nuke_0130.m4a" preload="auto"></audio>
<audio id="nuke_0030" src="nuke_0030.m4a" preload="auto"></audio>
<audio id="nuke_0010" src="nuke_0010.m4a" preload="auto"></audio>
<audio id="nuke_start" src="nuke_start.m4a" preload="auto"></audio>

<audio id="odawara_0130" src="odawara_0130.m4a" preload="auto"></audio>
<audio id="odawara_0030" src="odawara_0030.m4a" preload="auto"></audio>
<audio id="odawara_0010" src="odawara_0010.m4a" preload="auto"></audio>
<audio id="odawara_start" src="odawara_start.m4a" preload="auto"></audio>

<audio id="bourou_0130" src="bourou_0130.m4a" preload="auto"></audio>
<audio id="bourou_0030" src="bourou_0030.m4a" preload="auto"></audio>
<audio id="bourou_0010" src="bourou_0010.m4a" preload="auto"></audio>
<audio id="bourou_start" src="bourou_start.m4a" preload="auto"></audio>

  <script>
    let timer;
    let startTime;
    const totalSeconds = 3600;
    const playedEvents = new Set();

/* 自動再生ブロック解除 */
async function unlockAudio() {
  const s = document.getElementById("silent");

  try {
    s.currentTime = 0;
    await s.play();
    s.pause();
    s.currentTime = 0;
  } catch (e) {}
}

const eventMap = {
  0003: { id: "MCcheck", label: "マイクチェック" },

  // 山城近くへ遷都（15:00）
  810: { id: "sento_0130", label: "山城近くへ遷都 1分30秒前" },
  870: { id: "sento_0030", label: "山城近くへ遷都 30秒前" },
  890: { id: "sento_0010", label: "山城近くへ遷都 10秒前" },
  900: { id: "sento_start", label: "飛ぶよ！" },
      
  // 山城解放（20:00）
  1110: { id: "yama_0130", label: "山城解放 1分30秒前" },
  1170: { id: "yama_0030", label: "山城解放 30秒前" },
  1190: { id: "yama_0010", label: "山城解放 10秒前" },
  1200: { id: "yama_start", label: "山城が解放されました。" },

  // 抜け道（27:00）
  1530: { id: "nuke_0130", label: "抜け道 1分30秒前" },
  1590: { id: "nuke_0030", label: "抜け道 30秒前" },
  1610: { id: "nuke_0010", label: "抜け道 10秒前" },
  1620: { id: "nuke_start", label: "抜け道が解放されました。" },

  // 小田原城（35:00）
  2010: { id: "odawara_0130", label: "小田原城解放 1分30秒前" },
  2070: { id: "odawara_0030", label: "小田原城解放 30秒前" },
  2090: { id: "odawara_0010", label: "小田原城解放 10秒前" },
  2100: { id: "odawara_start", label: "小田原城が解放されました。" },

  // 中央の望楼（45:00）
  2610: { id: "bourou_0130", label: "中央の望楼解放 1分30秒前" },
  2670: { id: "bourou_0030", label: "中央の望楼解放 30秒前" },
  2690: { id: "bourou_0010", label: "中央の望楼解放 10秒前" },
  2700: { id: "bourou_start", label: "中央の望楼が解放されました。" }
};
async function warmupAll() {

  const audios = document.querySelectorAll("audio");

  for (const audio of audios) {

    // silentはunlockAudioで処理済み
    if (audio.id === "silent") continue;

    try {

      audio.volume = 0;

      audio.currentTime = 0;

      // 読み込み待ち
      if (audio.readyState < 3) {
        await new Promise(resolve => {
          audio.addEventListener(
            "canplaythrough",
            resolve,
            { once:true }
          );
          audio.load();
        });
      }

      await audio.play();

      // 少しだけ再生時間を確保
      await new Promise(resolve => setTimeout(resolve, 300));

      audio.pause();
      audio.currentTime = 0;
      audio.volume = 1;

    } catch (err) {
      console.log("warmup error", audio.id, err);
    }

  }

}

    
    async function startTimer() {

      await unlockAudio();
  
      
      clearInterval(timer);
      playedEvents.clear();
      startTime = new Date();

      const future = new Date(startTime.getTime() + totalSeconds * 1000);
      document.getElementById("nextTime").textContent =
        "60分後の時刻: " + future.toLocaleTimeString();

      document.getElementById("history").innerHTML = "";



timer = setInterval(() => {
  const now = new Date();
  const elapsed = Math.floor((now - startTime) / 1000);
  const remaining = totalSeconds - elapsed;

  const minutes = Math.floor(remaining / 60);
  const seconds = remaining % 60;

  document.getElementById("countdown").textContent =
    `残り時間: ${minutes}分${seconds}秒`;

  if (eventMap[elapsed] && !playedEvents.has(elapsed)) {
    const { id, label } = eventMap[elapsed];
    const oldAudio = document.getElementById(id);

if (oldAudio) {

    const audio = new Audio(oldAudio.src);
    audio.preload = "auto";

    audio.addEventListener("canplaythrough", () => {
        audio.play().catch(e => console.log(e));
    }, { once: true });

    audio.load();

}

    const mm = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const ss = String(elapsed % 60).padStart(2, '0');
    const timestamp = now.toLocaleTimeString();

    const entry = document.createElement("div");
    entry.textContent = `${mm}分${ss}秒経過・${label}・${timestamp}`;

    const history = document.getElementById("history");
    history.insertBefore(entry, history.firstChild);

    playedEvents.add(elapsed);
  }

  if (remaining <= 0) {
    clearInterval(timer);

    const entry = document.createElement("div");
    entry.textContent =
      `60分00秒経過・タイマー終了・${now.toLocaleTimeString()}`;

    const history = document.getElementById("history");
    history.insertBefore(entry, history.firstChild);
  }

}, 1000);

    }
  </script>
</body>
</html>
